- name: Prepare administrator account
  hosts: jenkins
  gather_facts: false
  become: true

  tasks:
    - name: Ensure devops user exists
      ansible.builtin.user:
        name: devops
        shell: /bin/bash
        create_home: true
        groups: sudo
        append: true

    - name: Ensure SSH directory exists
      ansible.builtin.file:
        path: /home/devops/.ssh
        state: directory
        owner: devops
        group: devops
        mode: '0700'

    - name: Ensure Ansible public key is authorized
      ansible.posix.authorized_key:
        user: devops
        key: "{{ lookup('ansible.builtin.file', '/home/ansible/.ssh/ansible_learning.pub') }}"
        state: present
        exclusive: false
