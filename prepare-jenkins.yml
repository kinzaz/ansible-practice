- name: Prepare Jenkins server
  hosts: jenkins
  become: true
  gather_facts: true

  tasks:
    - name: Prepare operating system
      ansible.builtin.import_role:
        name: server_base
      tags:
        - server_base

    - name: Configure Docker
      ansible.builtin.import_role:
        name: docker
      tags:
        - docker

    - name: Configure Jenkins
      ansible.builtin.import_role:
        name: jenkins
      tags:
        - jenkins

    - name: Prepare Jenkins agent
      ansible.builtin.import_role:
        name: jenkins_agent
      tags:
        - jenkins_agent
